
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[档案] 离职员工清算名单</title>
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: #1a1a1a;
            --text-main: #888888;
            --text-light: #cccccc;
            --text-accent-green: #2e8b57;
            --text-accent-red: #b02020;
            --border-color: #333333;
            --locked-color: #666666;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: var(--text-light);
            font-size: 1.4em;
            margin-bottom: 30px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
        }
        .employee-list {
            list-style: none;
            padding: 0;
        }
        .employee-item {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .employee-item:hover {
            border-color: var(--text-accent-green);
            color: var(--text-light);
            transform: translateX(5px);
        }
        .employee-item.locked {
            opacity: 0.6;
            border-color: var(--locked-color);
        }
        .employee-item.locked:hover {
            border-color: var(--text-accent-red);
            color: var(--text-accent-red);
        }
        .employee-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lock-icon {
            font-size: 0.85em;
            color: var(--text-accent-red);
        }
        .status {
            font-size: 0.9em;
        }
        .status.offline { color: var(--text-accent-red); }
        .status.pending { color: var(--text-accent-green); }
        .status.archived { color: var(--locked-color); }
        .back-link {
            display: block;
            margin-top: 40px;
            text-align: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { color: var(--text-light); }
        .footer-note {
            font-size: 0.8em;
            color: #555;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>[档案] 离职员工清算名单</h1>
        
        <ul class="employee-list">
            <li class="employee-item" onclick="window.location.href='profile.html?id=001'">
                <span class="employee-name">档案 001: 李建国</span>
                <span class="status offline">状态：已离线</span>
            </li>
            <li class="employee-item" onclick="window.location.href='profile.html?id=002'">
                <span class="employee-name">档案 002: 王晓红</span>
                <span class="status offline">状态：已离线</span>
            </li>
            <li class="employee-item locked" onclick="window.location.href='profile.html?id=003'">
                <span class="employee-name"><span class="lock-icon">🔒</span> 档案 003: 陈默 (前技术主管)</span>
                <span class="status pending">状态：[待处理]</span>
            </li>
            <li class="employee-item" onclick="window.location.href='profile.html?id=004'">
                <span class="employee-name">档案 004: 赵明辉</span>
                <span class="status offline">状态：已离线</span>
            </li>
            <li class="employee-item" onclick="window.location.href='profile.html?id=005'">
                <span class="employee-name">档案 005: 林小婉</span>
                <span class="status offline">状态：已离线</span>
            </li>
            <li class="employee-item locked" onclick="window.location.href='profile.html?id=006'">
                <span class="employee-name"><span class="lock-icon">🔒</span> 档案 006: 周建平</span>
                <span class="status archived">状态：已归档</span>
            </li>
            <li class="employee-item" onclick="window.location.href='profile.html?id=007'">
                <span class="employee-name">档案 007: 苏婉婷</span>
                <span class="status offline">状态：已离线</span>
            </li>
            <li class="employee-item" onclick="window.location.href='profile.html?id=008'">
                <span class="employee-name">档案 008: 张维</span>
                <span class="status offline">状态：已离线</span>
            </li>
        </ul>

        <div class="footer-note">
            注意：部分档案已加密，需输入管理员权限方可解锁查阅。
        </div>

        <a href="index.html" class="back-link">&lt; 返回总控面板</a>
    </div>
</body>
</html>
