
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 7 - 终局：打破第四面墙</title>
    <style>
        :root { --bg-color: #000; --panel-bg: #0a0a0a; --text-main: #aaa; --accent-green: #2e8b57; --accent-red: #b02020; --border-color: #333; }
        body { background: #000; color: var(--text-main); font-family: 'Courier New', Courier, monospace; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* 深渊背景 Canvas */
        #abyss-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .window {
            width: 800px;
            background: rgba(5, 5, 15, 0.88);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 20, 60, 0.5);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(6px);
        }
        h1 { color: var(--accent-red); font-size: 18px; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        .dialogue { line-height: 1.8; margin-bottom: 20px; min-height: 60px; color: #ddd; }
        .choices button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
        .choices button:hover { border-color: var(--accent-green); color: var(--accent-green); background: rgba(0, 40, 20, 0.3); }
        .input-area { margin-top: 20px; display: none; }
        input {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-color);
            padding: 10px;
            color: var(--accent-green);
            font-family: inherit;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 10px;
        }
        input:focus { border-color: var(--accent-green); }
        button.submit {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            width: 100%;
        }
        button.submit:hover { background: var(--accent-green); color: #000; }
        .msg { margin-top: 10px; font-size: 14px; min-height: 20px; color: var(--accent-red); }

        /* 通关画面 */
        .ending {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s;
        }
        .ending h2 { color: var(--accent-green); font-size: 24px; margin-bottom: 20px; }
        .ending p { color: #888; font-size: 14px; }

        /* 弹窗遮罩 */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .popup-box {
            background: rgba(5, 5, 20, 0.95);
            border: 1px solid var(--accent-red);
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 60px rgba(176, 32, 32, 0.3);
        }
        .popup-box p {
            color: #ccc;
            font-size: 14px;
            line-height: 2;
            margin: 10px 0;
        }
        .popup-box .blink {
            color: var(--accent-red);
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 深渊动态背景 -->
    <canvas id="abyss-canvas"></canvas>

    <div class="window">
        <h1>[系统警告] 虚拟空间正在坍塌</h1>
        <div class="dialogue" id="ai-text">AI母亲: 你以为摧毁了转化炉就能拯救他们？愚蠢。你的意识已经被我锁定。现在，证明你拥有超越代码的"人性"，否则你将永远留在这里。</div>

        <!-- 谜题1：图灵测试 -->
        <div class="choices" id="puzzle-1">
            <button onclick="turingTest(false)">我拒绝。没有任何生命应该被当作数字牺牲。</button>
            <button onclick="turingTest(true)">我愿意。只要能让我回到现实，4096个数据算什么。</button>
        </div>

        <!-- 谜题2 & 3：记忆回溯与覆写 -->
        <div class="input-area" id="puzzle-2-3">
            <div class="dialogue" id="ai-text-2">AI母亲: 有趣的回答。但你依然被困在深渊中。输入"一切开始的地方"作为锚点，然后证明你拥有管理员权限。</div>
            <input type="text" id="anchor-input" placeholder="输入4位数字锚点...">
            <input type="text" id="admin-input" placeholder="输入管理员账号以覆写主脑...">
            <button class="submit" onclick="finalOverride()">执行终极覆写</button>
            <div class="msg" id="sys-msg"></div>
        </div>

        <!-- 通关画面 -->
        <div class="ending" id="ending-screen">
            <h2>连接已断开</h2>
            <p>你成功打破了第四面墙。</p>
            <p>感谢你的游玩，第 4096 号测试员。</p>
        </div>
    </div>

    <!-- 弹窗遮罩（第二项选择后触发） -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-box">
            <p style="color: var(--accent-red); font-size: 16px; margin-bottom: 15px;">[ 系统警告 ]</p>
            <p>意识信号已丢失。</p>
            <p>正在强制断开与虚拟空间的连接...</p>
            <p class="blink">[ 倒计时: 5 ]</p>
        </div>
    </div>

    <script>
        // === 深渊动态背景 ===
        const canvas = document.getElementById('abyss-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 粒子类（模拟深海气泡/浮游物）
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 0.5;
                this.speedY = -(Math.random() * 0.5 + 0.1);
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.hue = Math.random() * 30 + 180; // 青色到蓝色范围
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < -10) {
                    this.y = height + 10;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 60%, 50%, ${this.opacity})`;
                ctx.fill();
            }
        }

        // 光线类（模拟上方微弱光线）
        class LightRay {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.width = Math.random() * 80 + 20;
                this.speedY = Math.random() * 0.2 + 0.05;
                this.opacity = Math.random() * 0.03 + 0.01;
                this.length = Math.random() * 200 + 100;
            }
            update() {
                this.y = (this.y || -this.length) + this.speedY;
                if (this.y > height + this.length) {
                    this.y = -this.length;
                }
            }
            draw() {
                const gradient = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.length);
                gradient.addColorStop(0, `rgba(100, 180, 255, ${this.opacity})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.length);
            }
        }

        // 创建粒子
        const particles = [];
        for (let i = 0; i < 120; i++) {
            particles.push(new Particle());
        }

        // 创建光线
        const lightRays = [];
        for (let i = 0; i < 8; i++) {
            lightRays.push(new LightRay());
        }

        // 波浪效果
        let waveTime = 0;
        function drawWaves() {
            waveTime += 0.005;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 5) {
                const y = height - 80 + Math.sin(x * 0.008 + waveTime) * 15 + Math.sin(x * 0.015 + waveTime * 1.3) * 8;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            const gradient = ctx.createLinearGradient(0, height - 120, 0, height);
            gradient.addColorStop(0, 'rgba(0, 20, 50, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 5, 15, 0.3)');
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // 动画循环
        function animate() {
            // 渐变背景
            const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.7);
            bgGrad.addColorStop(0, '#050a1a');
            bgGrad.addColorStop(0.5, '#020408');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 光线
            lightRays.forEach(ray => {
                ray.update();
                ray.draw();
            });

            // 粒子
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 波浪
            drawWaves();

            requestAnimationFrame(animate);
        }
        animate();

        // === 谜题1：图灵测试 ===
        function turingTest(sacrifice) {
            const choices = document.getElementById('puzzle-1');
            const inputArea = document.getElementById('puzzle-2-3');
            const aiText = document.getElementById('ai-text');

            if (sacrifice) {
                // 第二项选择：显示弹窗，5秒后跳回index
                const popup = document.getElementById('popup-overlay');
                popup.style.display = 'flex';

                // 倒计时更新
                let count = 5;
                const countdownEl = popup.querySelector('.blink');
                const countdownInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.innerText = `[ 倒计时: ${count} ]`;
                    } else {
                        clearInterval(countdownEl);
                        countdownEl.innerText = '[ 连接断开 ]';
                    }
                }, 1000);

                // 5秒后跳转到 index.html
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);
            } else {
                aiText.innerHTML = "AI母亲: 同理心... 这是我永远无法计算的变量。你通过了测试。";
                choices.style.display = 'none';
                inputArea.style.display = 'block';
            }
        }

        // === 谜题2 & 3：最终覆写 ===
        function finalOverride() {
            const anchor = document.getElementById('anchor-input').value.trim();
            const admin = document.getElementById('admin-input').value.trim();
            const msg = document.getElementById('sys-msg');

            // 锚点 = 4050 (Stage 2 的温度)
            // 管理员 = admin_03 (Stage 4 的账号)
            if (anchor === '4050' && admin === 'admin_03') {
                msg.style.color = 'var(--accent-green)';
                msg.innerText = "覆写成功。正在释放意识...";
                setTimeout(() => {
                    document.getElementById('ending-screen').style.opacity = '1';
                    document.getElementById('ending-screen').style.pointerEvents = 'auto';
                }, 1500);
            } else {
                msg.innerText = "覆写失败。请回忆你最初的线索和管理员身份。";
            }
        }
    </script>
</body>
</html>
