
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>档案详情</title>
    <style>
        :root {
            --bg-color: #111111;
            --panel-bg: #1a1a1a;
            --text-main: #888888;
            --text-light: #cccccc;
            --text-accent-green: #2e8b57;
            --text-accent-red: #b02020;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border: 1px dashed var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            color: var(--text-main);
            font-size: 0.8em;
        }
        .info h2 {
            color: var(--text-light);
            margin: 0 0 5px 0;
            font-size: 1.4em;
        }
        .info p {
            margin: 0;
            font-size: 0.9em;
        }
        .resume-content {
            line-height: 1.8;
            font-size: 0.95em;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link:hover { color: var(--text-light); }

        /* 密码锁定界面 */
        .lock-screen {
            text-align: center;
            padding: 60px 20px;
        }
        .lock-screen h2 {
            color: var(--text-accent-red);
            font-size: 1.3em;
            margin-bottom: 20px;
        }
        .lock-screen p {
            color: var(--text-main);
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .lock-input-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .lock-input-area input {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-accent-green);
            padding: 10px 15px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            width: 200px;
        }
        .lock-input-area input:focus {
            border-color: var(--text-accent-green);
        }
        .lock-input-area button {
            background: transparent;
            border: 1px solid var(--text-accent-green);
            color: var(--text-accent-green);
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
        }
        .lock-input-area button:hover {
            background: var(--text-accent-green);
            color: #000;
        }
        .lock-error {
            color: var(--text-accent-red);
            font-size: 0.85em;
            min-height: 20px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 密码锁定界面 -->
        <div id="lockScreen" class="lock-screen">
            <h2>[ 权限不足 ] 该档案已加密</h2>
            <p>此员工的完整档案受管理员权限保护，请输入解锁密码以继续。</p>
            <div class="lock-input-area">
                <input type="password" id="lockPassword" placeholder="输入解锁密码...">
                <button onclick="checkPassword()">解锁</button>
            </div>
            <div class="lock-error" id="lockError"></div>
            <a href="employee_records.html" class="back-link" style="display:block; text-align:center; margin-top:20px;">&lt; 返回档案列表</a>
        </div>

        <!-- 正常档案内容（默认隐藏） -->
        <div id="profileContent" class="hidden">
            <div class="header">
                <div class="avatar-placeholder" id="avatarArea">
                    [头像占位]
                </div>
                <div class="info">
                    <h2 id="empName">加载中...</h2>
                    <p id="empRole">加载中...</p>
                </div>
            </div>
            <div class="resume-content" id="resumeContent"></div>
            <a href="employee_records.html" class="back-link">&lt; 返回档案列表</a>
        </div>
    </div>

    <script>
        // 员工数据配置
        const employees = {
            '001': {
                name: '李建国',
                role: '前运维工程师 (工号: 9527)',
                avatar: '',
                locked: false,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2015.03 - 2023.12 远山数据基础设施运维组<br>
                    负责核心服务器集群的日常维护与故障排查。2023年11月因"违规私自关闭核心机房防火墙"被强制停职。<br><br>
                    <strong>[状态]</strong><br>
                    目前已离线，权限已被全部收回。最后一次登录记录显示其 IP 来自海外未注册区。`
            },
            '002': {
                name: '王晓红',
                role: '前财务部审计 (工号: 8841)',
                avatar: '',
                locked: false,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2018.06 - 2024.01 远山数据财务审计部<br>
                    负责集团季度财务合规性审查。在离职前一个月，其审计报告中出现了大量被人为篡改的底层数据。<br><br>
                    <strong>[状态]</strong><br>
                    已离线。系统检测到其在离职前曾大量访问"陈默"的私人档案库。`
            },
            '003': {
                name: '陈默',
                role: '前技术主管 (工号: 0001)',
                avatar: '',
                locked: true,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2010.01 - 2024.05 远山数据技术研发部<br>
                    远山数据初创团队核心成员，"远山云端架构"主要设计师。2024年5月突然提出离职，并在离职前删除了大量核心代码库。<br><br>
                    <strong>[警告]</strong><br>
                    该人员档案已加密。系统检测到其残留的通讯痕迹正与一个名为 "Ghost_Walker" 的匿名者论坛账号关联。<br>
                    提示：其遗留的加密提取码可能与地理坐标有关。`
            },
            '004': {
                name: '赵明辉',
                role: '前安保主管 (工号: 6612)',
                avatar: '',
                locked: false,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2016.09 - 2023.08 远山数据安保管理部<br>
                    负责总部大楼三层及以下区域的物理安全与门禁管理。在职期间共处理过 17 起内部违规事件。<br><br>
                    <strong>[状态]</strong><br>
                    已离线。离职原因：在一次夜间巡逻中，其监控记录显示地下三层机房出现"不明生物信号"，随后赵明辉提交病假申请，再未返岗。`
            },
            '005': {
                name: '林小婉',
                role: '前数据标注员 (工号: 10203)',
                avatar: '',
                locked: false,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2021.04 - 2024.03 远山数据标注部<br>
                    负责对"潘多拉计划"采集的原始生物算力数据进行标注与分类。日均处理量约 50,000 条记录。<br><br>
                    <strong>[状态]</strong><br>
                    已离线。离职前一周频繁在深夜访问标注系统，其标注记录中出现大量重复标记同一组数据的异常行为。该组数据的原始编号已被清除。`
            },
            '006': {
                name: '周建平',
                role: '前网络工程师 (工号: 4408)',
                avatar: '',
                locked: true,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2014.06 - 2024.06 远山数据网络架构部<br>
                    负责远山数据总部与远山数据中心之间的专线网络维护。是唯一拥有底层网络路由表完整权限的外部工程师。<br><br>
                    <strong>[警告]</strong><br>
                    该人员档案已被标记为"高度敏感"。系统记录显示，其在离职前 72 小时内，通过未加密通道向外部传输了约 4.7TB 的日志数据。传输目标 IP 指向一个已注销的虚拟服务器。`
            },
            '007': {
                name: '苏婉婷',
                role: '前HR主管 (工号: 2201)',
                avatar: '',
                locked: false,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2017.01 - 2024.02 远山数据人力资源部<br>
                    负责集团员工入职、离职全流程管理及内部人事档案维护。在职期间经手处理过超过 200 份员工档案。<br><br>
                    <strong>[状态]</strong><br>
                    已离线。离职原因存疑：其离职审批流程在提交后 2 小时内即被高层特批通过，远快于标准 30 个工作日的流程。其离职后，所有内部通讯录中关于她的记录被自动清除。`
            },
            '008': {
                name: '张维',
                role: '前测试工程师 (工号: 7756)',
                avatar: '',
                locked: false,
                resume: `
                    <p><strong>[履历摘要]</strong></p>
                    <p>2019.11 - 2023.10 远山数据测试部<br>
                    负责对"盖亚"核心算法进行压力测试与边界条件验证。曾发现 3 处可能导致系统崩溃的深层漏洞。<br><br>
                    <strong>[状态]</strong><br>
                    已离线。离职前提交了一份长达 47 页的漏洞报告，其中第 31 页提到了一个名为"潘多拉"的隐藏子系统。该报告在提交后次日被标记为"已阅-销毁"。`
            }
        };

        // 各加密档案的解锁密码（小写）
        const passwordMap = {
            '003': 'chenmo',
            '006': 'zhoujianping'
        };

        // 检查密码
        function checkPassword() {
            const input = document.getElementById('lockPassword');
            const error = document.getElementById('lockError');
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (id && employees[id] && employees[id].locked) {
                const expected = passwordMap[id];
                if (expected && input.value.toLowerCase() === expected) {
                    // 密码正确，解锁
                    document.getElementById('lockScreen').classList.add('hidden');
                    document.getElementById('profileContent').classList.remove('hidden');
                    renderProfile(id);
                } else {
                    error.innerText = '> 解锁失败：密码错误，请重试。';
                    input.value = '';
                }
            }
        }

        // 回车键提交密码
        document.getElementById('lockPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // 渲染档案内容
        function renderProfile(id) {
            const emp = employees[id];
            if (!emp) {
                document.getElementById('empName').innerText = '未知人员';
                document.getElementById('resumeContent').innerText = '错误：未找到该人员档案数据。';
                return;
            }
            document.getElementById('empName').innerText = emp.name;
            document.getElementById('empRole').innerText = emp.role;
            document.getElementById('resumeContent').innerHTML = emp.resume;

            if (emp.avatar) {
                document.getElementById('avatarArea').innerHTML = `<img src="${emp.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
            }
        }

        // 页面加载：判断是否需要密码
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (id && employees[id]) {
                if (employees[id].locked) {
                    // 需要密码的档案，显示锁定界面
                    document.getElementById('lockScreen').classList.remove('hidden');
                    document.getElementById('profileContent').classList.add('hidden');
                } else {
                    // 无需密码的档案，直接显示
                    document.getElementById('lockScreen').classList.add('hidden');
                    document.getElementById('profileContent').classList.remove('hidden');
                    renderProfile(id);
                }
            } else {
                document.getElementById('empName').innerText = '未知人员';
                document.getElementById('resumeContent').innerText = '错误：未找到该人员档案数据。';
            }
        };
    </script>
</body>
</html>
