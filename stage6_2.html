<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 6-2 - 潘多拉核心 [DOS_MODE]</title>
    <style>
        :root {
            --bg-color: #000000;
            --terminal-bg: #050505;
            --text-dim: #4a4a4a;
            --text-main: #888888;
            --accent-green: #33ff33;
            --accent-red: #ff3333;
            --border-color: #333333;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', 'Lucida Console', monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        .window {
            width: 900px;
            background: var(--terminal-bg);
            border: 2px solid var(--accent-green);
            padding: 2px;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .inner-window {
            border: 1px solid var(--border-color);
            padding: 30px;
            height: 100%;
            overflow-y: auto;
        }

        .inner-window::-webkit-scrollbar { width: 8px; }
        .inner-window::-webkit-scrollbar-track { background: #000; }
        .inner-window::-webkit-scrollbar-thumb { background: var(--accent-green); }

        h1 {
            color: var(--accent-green);
            font-size: 16px;
            text-transform: uppercase;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(51, 255, 51, 0.5);
        }

        h2 {
            color: var(--accent-green);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: normal;
        }

        h2::before { content: "> "; }

        .desc-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 20px;
            border-left: 2px solid var(--text-dim);
            padding-left: 10px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
        }

        .puzzle-area {
            border: 1px solid var(--border-color);
            background: #000;
            padding: 20px;
            margin-bottom: 20px;
        }

        .log-display {
            background: #000;
            border: 1px solid var(--text-dim);
            padding: 15px;
            font-size: 12px;
            line-height: 1.9;
            color: var(--text-main);
            margin-bottom: 20px;
            max-height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .input-group label {
            color: var(--accent-green);
            font-size: 13px;
            white-space: nowrap;
        }

        .input-group input {
            background: #000;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 8px 12px;
            width: 200px;
            outline: none;
        }
        .input-group input:focus { box-shadow: 0 0 8px rgba(51, 255, 51, 0.3); }
        .input-group input::placeholder { color: var(--text-dim); }
        .input-group input:disabled { border-color: var(--accent-red); color: var(--accent-red); }

        .btn {
            background: #000;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn:hover { background: var(--accent-green); color: #000; font-weight: bold; }
        .btn:disabled { border-color: var(--text-dim); color: var(--text-dim); cursor: not-allowed; background: #000; }

        .attempts {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 10px;
        }

        .msg {
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
            font-weight: bold;
            line-height: 1.6;
        }
        .msg.success { color: var(--accent-green); text-shadow: 0 0 5px var(--accent-green); }
        .msg.error   { color: var(--accent-red); text-shadow: 0 0 5px var(--accent-red); }
        .msg.hint    { color: var(--accent-green); }

        .hidden { display: none !important; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="crt-overlay"></div>

<div class="window">
    <div class="inner-window">
        <div class="status-bar">
            <span>MEMORY: 640K OK</span>
            <span>C:\PANDORA\CORE\STAGE_6_2.EXE</span>
        </div>

        <h1>// 潘多拉核心 - 提取码 //</h1>

        <div id="puzzle-2" class="puzzle-area">
            <h2>机房温度提取码</h2>

            <div class="desc-text">
                [系统任务]: 检索加密数据卷。<br>
                [解密协议]: 依据日志记录 "机房最高温度，去掉小数点" 生成密钥。<br>
                [警告]: 检测到环境传感器阵列存在硬件故障。请执行数据清洗，仅提取有效的温度峰值。
            </div>

            <div class="log-display" id="log-display"></div>

            <div class="input-group hidden" id="input-group">
                <label>C:\&gt; ENTER_CODE:</label>
                <input type="text" id="code-input" placeholder="输入提取码..." autocomplete="off">
                <button class="btn" id="submit-btn">EXECUTE</button>
            </div>

            <div class="attempts hidden" id="attempts">ATTEMPTS_REMAINING: 5 / 5</div>

            <div id="p2-msg" class="msg"></div>
        </div>
    </div>
</div>

<script>
    const CORRECT_CODE = "386";
    const MAX_ATTEMPTS = 5;

    // 日志区已去除所有绿色高亮与线索方括号标注，仅保留纯客观记录
    const logLines = [
        "[2023-09-15 03:22:11] 系统启动，初始化远山数据3号机房环境监控...",
        "[2023-09-15 03:22:14] 温度传感器阵列上线。当前平均温度：22.4°C",
        "[2023-09-15 03:22:15] 湿度 45% | 供电正常 | 冷却回路 standby",
        "[2023-09-15 04:10:33] 潘多拉计划实验体接入，开始脑波同步（目标 Delta波 7.8Hz）...",
        "[2023-09-15 04:15:02] 警告：算力负载激增，GPU 集群发热，冷却系统启动",
        "[2023-09-15 04:18:47] 当前平均温度：28.1°C",
        "[2023-09-15 04:25:19] 实验体排异反应加剧，Delta波锁定失败，正在重试...",
        "[2023-09-15 04:31:55] 当前平均温度：33.7°C",
        "[2023-09-15 04:38:02] SENSOR_FAULT · 3号温度探头进入故障态，读数失真",
        "[2023-09-15 04:39:40] 瞬时读数 43.2°C",
        "[2023-09-15 04:40:12] 瞬时读数 41.9°C",
        "[2023-09-15 04:42:18] 冷却回路临时修复，3号探头数据已剔除",
        "[2023-09-15 04:47:33] 实验体全部进入植物人状态。潘多拉计划第一阶段失败。",
        "[2023-09-15 04:50:01] 张维研究员（YS-7756）登录日志系统，权限 LEVEL-3",
        "[2023-09-15 04:52:44] 机房最高温度记录：38.6°C",
        "[2023-09-15 04:53:10] 张维执行数据加密操作... 提取码规则：机房最高温度去掉小数点",
        "[2023-09-15 04:55:00] 会话被强制终止，张维意识被抹除。连接断开。",
        "[2023-09-15 05:10:22] 机房最高温度记录：39.4°C",
        "[2023-09-15 05:20:00] 系统进入低功耗模式，等待管理员介入。"
    ];

    function renderLog() {
        const container = document.getElementById('log-display');
        let i = 0;
        const timer = setInterval(() => {
            if (i < logLines.length) {
                const line = document.createElement('div');
                line.textContent = logLines[i];
                container.appendChild(line);
                container.scrollTop = container.scrollHeight;
                i++;
            } else {
                clearInterval(timer);
                setTimeout(() => {
                    document.getElementById('input-group').classList.remove('hidden');
                    document.getElementById('attempts').classList.remove('hidden');
                    document.getElementById('code-input').focus();
                }, 600);
            }
        }, 120);
    }

    const input   = document.getElementById('code-input');
    const btn     = document.getElementById('submit-btn');
    const msg     = document.getElementById('p2-msg');
    const attElem = document.getElementById('attempts');

    let attempts = MAX_ATTEMPTS;
    let solved = false;

    function diagnose(val) {
        if (val === "432" || val === "419") {
            return { cls: 'hint', txt: 'HINT: 你取的是 3号故障探头产生的失真尖峰。系统当场判定 [读数无效]，张维不会拿作废数据设密码。' };
        }
        if (val === "394") {
            return { cls: 'hint', txt: 'HINT: 这是全篇最大的"有效"读数，但它出现在 05:10 —— 张维的会话在 04:55 已被强制终止。他亲眼没见到的数字，不可能写进密码。' };
        }
        if (["224","281","337"].includes(val)) {
            return { cls: 'hint', txt: 'HINT: 你取的是冷却过程中的"平均温度"。提取码规则明确要的是"最高温度（峰值）"。' };
        }
        return { cls: 'error', txt: 'ACCESS_DENIED. 甄别链有误：先剔除故障无效读数，再排除张维断连之后的时段，再区分均值与峰值。RETRY.' };
    }

    function updateAttempts() {
        attElem.innerText = 'ATTEMPTS_REMAINING: ' + attempts + ' / ' + MAX_ATTEMPTS;
    }

    function lockout() {
        solved = true;
        msg.className = 'msg error';
        msg.innerHTML = 'SECURITY_LOCKOUT. 尝试次数耗尽，本模块已锁定。请刷新页面重新接入。';
        input.disabled = true;
        btn.disabled = true;
    }

    function checkCode() {
        if (solved) return;
        const val = input.value.trim();
        if (!val) {
            msg.className = 'msg error';
            msg.innerText = 'ERROR: EMPTY_INPUT. 请输入有效提取码。';
            return;
        }

        if (val === CORRECT_CODE) {
            solved = true;
            msg.className = 'msg success';
            msg.innerHTML = 'ACCESS_GRANTED. 提取码验证通过，正在解锁下一阶段...';
            input.disabled = true;
            btn.disabled = true;
            setTimeout(() => { window.location.href = 'stage6_3.html'; }, 2000);
            return;
        }

        attempts--;
        updateAttempts();
        if (attempts <= 0) { lockout(); return; }

        const fb = diagnose(val);
        msg.className = 'msg ' + fb.cls;
        msg.innerText = fb.txt;
        input.value = '';
        input.focus();
    }

    btn.addEventListener('click', checkCode);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkCode(); });

    renderLog();
</script>
</body>
</html>
